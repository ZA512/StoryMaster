name: ${COMPOSE_PROJECT_NAME:-storymaster}
services:
  postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    command: [postgres, -c, log_error_verbosity=terse, -c, log_min_error_statement=panic]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurer .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configurer .env}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Configurer .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Configurer .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/001-databases.sh:/docker-entrypoint-initdb.d/001-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [private]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Configurer .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin-local
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Configurer .env}
      KC_HOSTNAME: ${OIDC_ORIGIN:-http://localhost:8080}
      KC_HEALTH_ENABLED: 'true'
      STORYMASTER_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    volumes:
      - ./infra/keycloak/storymaster-realm.json:/opt/keycloak/data/import/storymaster-realm.json:ro
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks: [private, edge]
  migrate:
    build: {context: ., target: api}
    command: [node, --import, tsx, scripts/migrate.ts]
    environment:
      MIGRATION_DATABASE_URL: postgresql://storymaster_migrator:${MIGRATION_DB_PASSWORD}@postgres:5432/storymaster
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
  api:
    build: {context: ., target: api}
    environment:
      APP_ENV: ${APP_ENV:-local}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/storymaster}
      OIDC_INTERNAL_ORIGIN: http://keycloak:8080
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-storymaster-web}
      SESSION_SECRET: ${SESSION_SECRET:?Configurer .env}
      INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-172800}
      SESSION_SECONDS: ${SESSION_SECONDS:-28800}
      DATABASE_URL: postgresql://storymaster_app:${APP_DB_PASSWORD}@postgres:5432/storymaster
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
  web:
    build: {context: ., target: web}
    environment:
      API_INTERNAL_URL: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/connexion').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private, edge]
networks:
  private: {internal: true}
  edge: {}
volumes:
  postgres_data:
