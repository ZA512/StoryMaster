openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: StoryMaster — contrats de spécification
  version: 0.3.0
  description: 'Contrats MVP. Les opérations x-lot: 0 sont implémentées pour session humaine ; les autres restent
    des spécifications futures. Aucun serveur MCP au Lot 0.'
servers:
- url: http://localhost:3000/api/v1
  description: Docker Compose local seulement
- url: https://storymaster.example/api/v1
  description: Exemple réservé, aucun service déployé
security:
- webSession: []
- bearerAuth: []
