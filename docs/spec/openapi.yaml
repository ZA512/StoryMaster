            type: string
            minLength: 1
            maxLength: 1000
          required: true
        - name: types
          in: query
          schema:
            type: array
            maxItems: 4
            items:
              enum:
                - scene
                - character
                - place
                - event
          required: false
          style: form
          explode: false
        - name: status
          in: query
          schema: &a5
            enum:
