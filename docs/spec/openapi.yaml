openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: StoryMaster — contrats de spécification
  version: 0.9.1
  description: Contrats MVP. Lots 0–4 humains, Lot 5 phase A simulée, Lot 6 MCP local et Lot 7 récupération locale ; phase B commerciale et exposition publique différées.
servers:
  - url: http://localhost:3000/api/v1
    description: Docker Compose local seulement
  - url: https://storymaster.example/api/v1
    description: Exemple réservé, aucun service déployé
security:
  - webSession: []
  - bearerAuth: []
paths:
  /projects:
    parameters: []
    get:
      operationId: projectList
      summary: Lister les projets autorisés
      x-permission: project.read
      x-audit: A0
      responses:
        "200":
          description: Résultat métier autorisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProjectPage"
                required:
                  - data
                additionalProperties: false
          headers:
            ETag:
              schema:
                type: string
              description: Révision ressource ou pN-sN pour proposition
            Cache-Control:
              schema:
                type: string
              description: private,no-store pour contenu privé
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "412":
          $ref: "#/components/responses/Error412"
        "422":
          $ref: "#/components/responses/Error422"
        "428":
          $ref: "#/components/responses/Error428"
        "429":
          $ref: "#/components/responses/Error429"
