components:
  schemas:
    Id: *a2
    Revision: *a11
    ObjectRef:
      oneOf:
        - type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
          required:
            - id
          additionalProperties: false
        - type: object
          properties:
            tempId:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
          required:
            - tempId
          additionalProperties: false
    RichNode:
      type: object
      properties:
        type:
          enum:
            - doc
            - paragraph
            - text
            - heading
            - bulletList
            - orderedList
            - listItem
            - blockquote
            - hardBreak
        text:
          type: string
          maxLength: 1000000
        attrs:
          type: object
        marks:
          type: array
          items:
            type: object
            properties:
              type:
                enum:
                  - bold
                  - italic
                  - strike
                  - link
              attrs:
                type: object
            required:
              - type
            additionalProperties: false
        content:
          type: array
          items:
            $ref: "#/components/schemas/RichNode"
      required:
        - type
      additionalProperties: false
    RichDocument:
      allOf:
        - $ref: "#/components/schemas/RichNode"
        - properties:
            type:
              const: doc
          required:
            - content
    SceneReferenceInput:
      type: object
      properties:
        objectRef:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]+$
              required:
                - id
              additionalProperties: false
            - type: object
              properties:
                tempId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]+$
              required:
                - tempId
              additionalProperties: false
        referenceType:
          enum:
            - present
            - mentioned
            - point_of_view
            - setting
            - depicts_event
        metadata:
          type: object
          properties: {}
          required: []
          additionalProperties: false
      required:
        - objectRef
        - referenceType
      additionalProperties: false
    DependencyRevision:
      type: object
      properties:
        resourceType:
          enum:
            - object
            - scene
            - chapter
            - manuscript
            - relation
            - module
        resourceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        revision:
          type: integer
          minimum: 1
      required:
        - resourceType
        - resourceId
        - revision
      additionalProperties: false
    CharacterAttributes:
      type: object
      properties:
        aliases:
          maxItems: 100
          type: array
          items:
            type: string
            maxLength: 200
        description:
          type: string
          maxLength: 20000
        narrativeRole:
          type: string
          maxLength: 200
        motivations:
          maxItems: 100
          type: array
          items:
            type: string
            maxLength: 1000
        goals:
          maxItems: 100
          type: array
          items:
            type: string
            maxLength: 1000
        conflicts:
          maxItems: 100
          type: array
          items:
            type: string
            maxLength: 1000
        traits:
          maxItems: 100
          type: array
          items:
            type: string
            maxLength: 1000
        healthSummary:
          type: string
          maxLength: 4000
        conditionEventRefs:
          type: array
          items:
            $ref: "#/components/schemas/ObjectRef"
          maxItems: 100
      additionalProperties: false
    PlaceAttributes:
      type: object
      properties:
        description:
          type: string
          maxLength: 20000
        category:
          type: string
          maxLength: 200
        characteristics:
          maxItems: 100
          type: array
          items:
            type: string
            maxLength: 1000
        parentPlaceRef:
          anyOf:
            - $ref: "#/components/schemas/ObjectRef"
            - type: "null"
      additionalProperties: false
    EventAttributes:
      type: object
      properties:
        description:
          type: string
          maxLength: 20000
        chronologyPosition:
          type: number
          minimum: -9007199254740991
          maximum: 9007199254740991
        temporalExpression:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  const: unknown
              required:
                - kind
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: ordinal
                position:
                  type: number
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - kind
                - position
              additionalProperties: false
      additionalProperties: false
    CreateObject:
      type: object
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        kind:
          const: create_object
        tempId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        payload:
          type: object
          properties:
            typeKey:
              enum:
                - character
                - place
                - event
            schemaVersion:
              const: 1
            name:
              type: string
              minLength: 1
              maxLength: 200
            summary:
              type: string
              maxLength: 4000
            notes:
              type: string
              maxLength: 20000
            attributes:
              type: object
          required:
            - typeKey
            - schemaVersion
            - name
            - attributes
          additionalProperties: false
          allOf:
            - if:
                properties:
                  typeKey:
                    const: character
                required:
                  - typeKey
              then:
                properties:
                  attributes:
                    type: object
                    properties:
                      aliases:
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          maxLength: 200
                      description:
                        type: string
                        maxLength: 20000
                      narrativeRole:
                        type: string
                        maxLength: 200
                      motivations:
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          maxLength: 1000
                      goals:
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          maxLength: 1000
                      conflicts:
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          maxLength: 1000
                      traits:
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          maxLength: 1000
                      healthSummary:
                        type: string
                        maxLength: 4000
                      conditionEventRefs:
                        type: array
                        items:
                          $ref: "#/components/schemas/ObjectRef"
                        maxItems: 100
                    additionalProperties: false
            - if:
                properties:
                  typeKey:
                    const: place
                required:
                  - typeKey
              then:
                properties:
                  attributes:
                    type: object
                    properties:
                      description:
                        type: string
                        maxLength: 20000
                      category:
                        type: string
                        maxLength: 200
                      characteristics:
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          maxLength: 1000
                      parentPlaceRef:
                        anyOf:
                          - $ref: "#/components/schemas/ObjectRef"
                          - type: "null"
                    additionalProperties: false
            - if:
                properties:
                  typeKey:
                    const: event
                required:
                  - typeKey
              then:
                properties:
                  attributes:
                    type: object
                    properties:
                      description:
                        type: string
                        maxLength: 20000
                      chronologyPosition:
                        type: number
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      temporalExpression:
                        oneOf:
                          - type: object
                            properties:
                              kind:
                                type: string
                                const: unknown
                            required:
                              - kind
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                const: ordinal
                              position:
                                type: number
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                            required:
                              - kind
                              - position
                            additionalProperties: false
                    additionalProperties: false
        reason:
          type: string
          maxLength: 4000
      required:
        - operationId
        - kind
        - tempId
        - payload
      additionalProperties: false
    UpdateObject:
      type: object
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        kind:
          const: update_object
        targetId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        expectedRevision:
          type: integer
