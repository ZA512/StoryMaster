      x-permission: project.read
      x-audit: A0
      responses:
        '200':
          description: Résultat métier autorisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectPage'
                required:
                - data
                additionalProperties: false
          headers:
            ETag:
              schema:
                type: string
              description: Révision ressource ou pN-sN pour proposition
            Cache-Control:
              schema:
                type: string
              description: private,no-store pour contenu privé
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - &id002
        $ref: '#/components/parameters/Limit'
      - &id003
        $ref: '#/components/parameters/Cursor'
      x-lot: 0
      security:
      - webSession: []
    post:
      operationId: projectCreate
      summary: Créer un projet privé et son owner atomiquement
      x-lot: 0
      x-permission: project.create
      x-audit: A1
      security:
      - webSession: []
      responses:
        '201':
          description: Résultat autorisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
                required:
                - data
                additionalProperties: false
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
              description: 'Pour un projet : "rN".'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
