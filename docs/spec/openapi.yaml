            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProjectPage"
                required:
                  - data
                additionalProperties: false
          headers:
            ETag:
              schema:
                type: string
              description: Révision ressource ou pN-sN pour proposition
            Cache-Control:
              schema:
                type: string
              description: private,no-store pour contenu privé
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
