openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: StoryMaster — contrats de spécification
  version: 0.6.0
  description: Contrats MVP. x-lot 0/1/2/3 implémentés pour session humaine ; autres opérations et MCP spécifiés
    seulement.
servers:
  - url: http://localhost:3000/api/v1
    description: Docker Compose local seulement
  - url: https://storymaster.example/api/v1
