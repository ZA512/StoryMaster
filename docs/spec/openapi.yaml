  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag fort rN ou pN-sN ; absent 428, obsolète 412.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2000
    ProjectIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"r[1-9][0-9]*"$
      description: 'Révision de projet forte : "rN" ; absence 428, révision périmée 412.'
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
      description: Token lié à la session retourné par /me ; Origin doit égaler PUBLIC_ORIGIN.
    ProposalIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"p[1-9][0-9]*-s[1-9][0-9]*"$
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: __Host-sm_session
      description: "Cookie serveur HttpOnly, Secure, SameSite=Lax. En local HTTP seulement : sm_session_local. Origin exact et X-CSRF-Token pour mutation. Identité vérifiée par issuer+subject ; aucun bearer au Lot 0."
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth access token
      description: Issuer/aud/client/grant vérifiés ; jamais token IA ni ID token.
    mcpBearer:
      type: http
      scheme: bearer
      bearerFormat: Keycloak access JWT; local resource audience http://localhost:3500/mcp
  responses:
    Error400:
      description: VALIDATION_FAILED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error401:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error403:
      description: FORBIDDEN
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error404:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error409:
      description: PROPOSAL_CONFLICT / MODULE_DISABLED / INVALID_STATE_TRANSITION / IDEMPOTENCY_KEY_REUSED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error412:
      description: REVISION_CONFLICT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error422:
      description: VALIDATION_FAILED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error428:
      description: PRECONDITION_REQUIRED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error429:
      description: RATE_LIMITED / BUDGET_EXCEEDED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error500:
      description: INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error503:
      description: TEMPORARILY_UNAVAILABLE / PROVIDER_UNAVAILABLE
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error413:
      description: Corps ou export trop volumineux
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error415:
      description: Type de corps non supporté
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
