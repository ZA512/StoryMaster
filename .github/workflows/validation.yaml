name: Documentation et Lots 0–4
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.8.1'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt
      - name: Dépendances documentaires
        run: python -m pip install -r scripts/requirements-validation.txt
      - name: Contrats, traçabilité et tests du validateur
        run: |
          python scripts/validate_specifications.py
          python -m unittest discover -s scripts/tests -v
      - run: npm ci --no-audit --no-fund
      - name: Lint et dépendances architecturales
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Environnement réel PostgreSQL, Keycloak, API et web
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.test.yaml up -d --build --wait
      - name: Tests applicatifs et PostgreSQL
        run: npm test
      - name: Qualification préliminaire de contention
        run: npm run bench:contention
      - name: Contention des scènes et comparaison des barrières
        run: npm run bench:scenes
      - name: Recherche 10 000 objets et contention mixte narrative
        run: npm run bench:narrative
      - name: Collaboration, autosaves et administration concurrentes
        run: npm run bench:collaboration
      - name: Qualification du merge contre autosauvegardes indépendantes
        run: npm run bench:proposals
      - name: Navigateur
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: État des conteneurs en cas d'échec
        if: failure()
        run: docker compose -f compose.yaml -f compose.test.yaml ps -a
      - name: Nettoyage de cet environnement CI éphémère
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down --volumes --remove-orphans
  spike-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: spikes/editor/package-lock.json
      - name: Dépendances isolées du Spike A
        run: npm ci --prefix spikes/editor --no-audit --no-fund
      - name: TypeScript du prototype
        run: npm --prefix spikes/editor run typecheck
      - name: PostgreSQL éphémère dédiée, sans volume persistant
        run: docker compose -f spikes/editor/compose.yaml up -d --wait
      - name: Tests du schéma, révisions, concurrence et import Yjs
        run: npm --prefix spikes/editor test
      - name: Mesures reproductibles
        run: npm --prefix spikes/editor run bench
      - name: Éditeur réel et CSP dans Chromium
        run: |
          spikes/editor/node_modules/.bin/playwright install --with-deps chromium
          npm --prefix spikes/editor run test:browser
      - name: Arrêt de la sandbox éphémère uniquement
        if: always()
        run: docker compose -f spikes/editor/compose.yaml down
